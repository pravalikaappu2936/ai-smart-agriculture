name: Update Karnataka Government Market Prices

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

concurrency:
  group: market-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Sync BEFORE modifying market_cache.json
      # ---------------------------------------------------------
      - name: Sync with latest main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Fetching latest remote changes..."

          git fetch origin main

          echo "Rebasing on latest origin/main..."

          git rebase origin/main

          echo "Repository synchronized successfully."

      # ---------------------------------------------------------
      # 3. Fetch Karnataka government market prices
      # ---------------------------------------------------------
      - name: Fetch official Data.gov.in market data
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          RESOURCE_ID = "9ef84268-d588-465a-a308-a864a43d0070"

          API_URL = (
              f"https://api.data.gov.in/resource/{RESOURCE_ID}"
          )

          STATE = "Karnataka"

          # Number of records requested per API call
          PAGE_SIZE = 10000

          # Maximum total records to fetch
          MAX_RECORDS = 50000

          # -----------------------------------------------------
          # API key
          # -----------------------------------------------------
          api_key = os.environ.get("DATA_GOV_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "DATA_GOV_API_KEY GitHub Secret is missing."
              )

          api_key = api_key.strip()

          if not api_key:
              raise RuntimeError(
                  "DATA_GOV_API_KEY GitHub Secret is empty."
              )

          # -----------------------------------------------------
          # Fetch Karnataka records
          # -----------------------------------------------------
          all_records = []

          offset = 0

          while offset < MAX_RECORDS:

              params = {
                  "api-key": api_key,
                  "format": "json",
                  "limit": PAGE_SIZE,
                  "offset": offset,

                  # Karnataka filter
                  "filters[state.keyword]": STATE,
              }

              url = API_URL + "?" + urlencode(params)

              print("=" * 70)

              print(
                  f"Fetching Karnataka market data "
                  f"(offset={offset}, limit={PAGE_SIZE})"
              )

              print("=" * 70)

              request = Request(
                  url,
                  headers={
                      "User-Agent":
                          "AI-Smart-Agriculture/1.0"
                  },
              )

              try:

                  with urlopen(
                      request,
                      timeout=120
                  ) as response:

                      raw_data = response.read()

                  data = json.loads(
                      raw_data.decode("utf-8")
                  )

              except Exception as error:

                  raise RuntimeError(
                      "Data.gov.in request failed "
                      f"at offset {offset}: {error}"
                  ) from error

              records = data.get("records", [])

              if not isinstance(records, list):

                  raise RuntimeError(
                      "Invalid records returned by Data.gov.in."
                  )

              print(
                  f"Records received: {len(records)}"
              )

              if not records:

                  print(
                      "No more records available."
                  )

                  break

              # -------------------------------------------------
              # Normalize records
              # -------------------------------------------------
              for record in records:

                  if not isinstance(record, dict):
                      continue

                  all_records.append({
                      "state": record.get("state"),
                      "district": record.get("district"),
                      "market": record.get("market"),
                      "commodity": record.get("commodity"),
                      "variety": record.get("variety"),
                      "grade": record.get("grade"),
                      "arrival_date": record.get("arrival_date"),
                      "min_price": record.get("min_price"),
                      "max_price": record.get("max_price"),
                      "modal_price": record.get("modal_price"),
                  })

              offset += len(records)

              print(
                  f"Total fetched so far: "
                  f"{len(all_records)}"
              )

              # Final page
              if len(records) < PAGE_SIZE:

                  print(
                      "Final page reached."
                  )

                  break

              time.sleep(1)

          # -----------------------------------------------------
          # Remove duplicates
          # -----------------------------------------------------
          unique_records = []

          seen = set()

          for record in all_records:

              key = (
                  record.get("state"),
                  record.get("district"),
                  record.get("market"),
                  record.get("commodity"),
                  record.get("variety"),
                  record.get("grade"),
                  record.get("arrival_date"),
                  record.get("min_price"),
                  record.get("max_price"),
                  record.get("modal_price"),
              )

              if key in seen:
                  continue

              seen.add(key)

              unique_records.append(record)

          # -----------------------------------------------------
          # Validate
          # -----------------------------------------------------
          if not unique_records:

              raise RuntimeError(
                  "No Karnataka market records were returned."
              )

          # -----------------------------------------------------
          # Statistics
          # -----------------------------------------------------
          districts = sorted(
              {
                  r.get("district")
                  for r in unique_records
                  if r.get("district")
              }
          )

          markets = sorted(
              {
                  r.get("market")
                  for r in unique_records
                  if r.get("market")
              }
          )

          commodities = sorted(
              {
                  r.get("commodity")
                  for r in unique_records
                  if r.get("commodity")
              }
          )

          print("=" * 70)

          print(
              "KARNATAKA MARKET DATA SUMMARY"
          )

          print("=" * 70)

          print(
              f"Total records fetched: "
              f"{len(all_records)}"
          )

          print(
              f"Unique records stored: "
              f"{len(unique_records)}"
          )

          print(
              f"Districts found: "
              f"{len(districts)}"
          )

          print(
              f"Markets found: "
              f"{len(markets)}"
          )

          print(
              f"Commodities found: "
              f"{len(commodities)}"
          )

          print()

          print("Districts:")

          for district in districts:
              print(
                  f"  - {district}"
              )

          print()

          print("Markets:")

          for market in markets:
              print(
                  f"  - {market}"
              )

          print("=" * 70)

          # -----------------------------------------------------
          # Create cache
          # -----------------------------------------------------
          cache = {
              "success": True,

              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),

              "source": "Data.gov.in",

              "resource_id": RESOURCE_ID,

              "state": STATE,

              "total": len(unique_records),

              "records": unique_records,
          }

          # -----------------------------------------------------
          # Save cache
          # -----------------------------------------------------
          cache_path = Path(
              "backend/data/market_cache.json"
          )

          cache_path.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          cache_path.write_text(
              json.dumps(
                  cache,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print(
              "Karnataka market cache updated successfully."
          )

          print(
              f"Records stored: "
              f"{len(unique_records)}"
          )

          print(
              f"Districts: "
              f"{len(districts)}"
          )

          print(
              f"Markets: "
              f"{len(markets)}"
          )

          PY

      # ---------------------------------------------------------
      # 4. Commit cache
      # ---------------------------------------------------------
      - name: Commit updated market cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/market_cache.json

          if git diff --cached --quiet; then
            echo "No market data changes."
            exit 0
          fi

          git commit -m "Update Karnataka government market prices"

          echo "Market cache committed successfully."

      # ---------------------------------------------------------
      # 5. Push cache
      # ---------------------------------------------------------
      - name: Push updated market cache
        run: |
          git push origin HEAD:main

          echo "Market cache pushed successfully."