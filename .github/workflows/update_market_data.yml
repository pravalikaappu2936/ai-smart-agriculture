name: Update Karnataka Government Market Prices

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Karnataka market prices
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          RESOURCE_ID = "9ef84268-d588-465a-a308-a864a43d0070"
          API_URL = f"https://api.data.gov.in/resource/{RESOURCE_ID}"

          STATE = "Karnataka"

          # Increased from 1,000 to 10,000 records per request
          PAGE_SIZE = 1000

          # Safety limit: allows multiple pages if Karnataka has
          # more than 10,000 records.
          MAX_RECORDS = 50000

          api_key = os.environ.get("DATA_GOV_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "DATA_GOV_API_KEY GitHub Secret is missing."
              )

          api_key = api_key.strip()

          if not api_key:
              raise RuntimeError(
                  "DATA_GOV_API_KEY GitHub Secret is empty."
              )

          all_records = []
          offset = 0

          while offset < MAX_RECORDS:

              params = {
                  "api-key": api_key,
                  "format": "json",
                  "limit": PAGE_SIZE,
                  "offset": offset,

                  # IMPORTANT:
                  # Fetch only Karnataka records.
                  "filters[state]": STATE,
              }

              url = API_URL + "?" + urlencode(params)

              print(
                  f"Fetching Karnataka records: "
                  f"offset={offset}, limit={PAGE_SIZE}"
              )

              request = Request(
                  url,
                  headers={
                      "User-Agent": "AI-Smart-Agriculture/1.0"
                  },
              )

              try:
                  with urlopen(request, timeout=120) as response:
                      raw_data = response.read()

                  data = json.loads(
                      raw_data.decode("utf-8")
                  )

              except Exception as error:
                  raise RuntimeError(
                      f"Data.gov.in request failed at offset "
                      f"{offset}: {error}"
                  ) from error

              records = data.get("records", [])

              if not isinstance(records, list):
                  raise RuntimeError(
                      "Invalid records returned by Data.gov.in."
                  )

              print(
                  f"Received {len(records)} records."
              )

              if not records:
                  break

              for record in records:

                  if not isinstance(record, dict):
                      continue

                  all_records.append({
                      "state": record.get("state"),
                      "district": record.get("district"),
                      "market": record.get("market"),
                      "commodity": record.get("commodity"),
                      "variety": record.get("variety"),
                      "grade": record.get("grade"),
                      "arrival_date": record.get("arrival_date"),
                      "min_price": record.get("min_price"),
                      "max_price": record.get("max_price"),
                      "modal_price": record.get("modal_price"),
                  })

              offset += len(records)

              # If fewer than PAGE_SIZE were returned,
              # we reached the final page.
              if len(records) < PAGE_SIZE:
                  break

              # Small delay between requests.
              time.sleep(1)

          # Remove duplicate records.
          unique_records = []
          seen = set()

          for record in all_records:

              key = (
                  record.get("state"),
                  record.get("district"),
                  record.get("market"),
                  record.get("commodity"),
                  record.get("variety"),
                  record.get("grade"),
                  record.get("arrival_date"),
                  record.get("min_price"),
                  record.get("max_price"),
                  record.get("modal_price"),
              )

              if key in seen:
                  continue

              seen.add(key)
              unique_records.append(record)

          print(
              f"Total Karnataka records fetched: "
              f"{len(unique_records)}"
          )

          if not unique_records:
              raise RuntimeError(
                  "No Karnataka market records were returned."
              )

          cache = {
              "success": True,
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "source": "Data.gov.in",
              "resource_id": RESOURCE_ID,
              "state": STATE,
              "total": len(unique_records),
              "records": unique_records,
          }

          cache_path = Path(
              "backend/data/market_cache.json"
          )

          cache_path.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          cache_path.write_text(
              json.dumps(
                  cache,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print(
              "Karnataka market cache updated successfully."
          )

          print(
              f"Records stored: {len(unique_records)}"
          )

          print(
              f"Cache file: {cache_path}"
          )
          PY

      - name: Commit updated market cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/market_cache.json

          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "Update Karnataka government market prices"
            git push
          fi